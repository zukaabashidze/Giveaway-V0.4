<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard 🛠️</title>
    <style>
        :root {
            --primary: #00d4ff;
            --accent: #0055ff;
            --bg: #050510;
            --card-bg: rgba(255, 255, 255, 0.03);
            --danger: #ff4b2b;
            --success: #00ff88;
            --text-color: #ffffff;
        }
        
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* ფონი მეორე დიზაინიდან */
            background: var(--bg);
            background: radial-gradient(circle at top left, #0a0a20, #050510) fixed;
            background-size: cover;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            position: relative;
            color: var(--text-color);
        }
        
        /* მუქი ფენა სურათისთვის (თუ გამოიყენებ ფონურ სურათს) */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }
        
        /* წვიმის კონტეინერი - ახლა ლურჯ ფერებში */
        .rain {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        
        .drop {
            position: absolute;
            background: linear-gradient(to bottom, transparent, var(--primary)); /* ლურჯი წვიმა */
            width: 1px;
            height: 80px;
            top: -100px;
            opacity: 0.5;
            animation: fall 0.5s linear infinite;
        }
        
        @keyframes fall {
            to { transform: translateY(120vh); }
        }
        
        /* რეგისტრაციის ბარათი - ფუტურისტული სტილი */
        .card {
            position: relative;
            z-index: 10;
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 212, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            width: 350px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 
                        0 0 20px rgba(0, 212, 255, 0.1);
        }
        
        h2 {
            font-size: 28px;
            background: linear-gradient(to right, var(--primary), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 14px;
            margin-bottom: 25px;
            color: #888;
        }
        
        /* ინპუტები */
        input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.2);
            color: white;
            padding: 12px;
            border-radius: 10px;
            width: calc(100% - 26px);
            margin-bottom: 15px;
            outline: none;
            transition: 0.3s;
        }
        
        input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }
        
        /* ღილაკი - ლურჯი გრადიენტით */
        button {
            background: linear-gradient(45deg, var(--accent), var(--primary));
            border: none;
            padding: 15px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.2);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
            filter: brightness(1.1);
        }
        
        /* შეტყობინებები */
        #msg {
            margin-top: 15px;
            font-size: 14px;
            min-height: 1em;
        }
        
        .error { color: var(--danger); }
        .success { color: var(--success); }
        
        /* დაბლოკილი მომხმარებლის კონტეინერი */
        .blocked-container {
            position: relative;
            z-index: 100;
            text-align: center;
            background: rgba(5, 5, 16, 0.9);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid var(--danger);
            box-shadow: 0 0 30px rgba(255, 75, 43, 0.2);
        }
        
        /* IP ტეგები და სხვა ელემენტები */
        .ip-tag {
            background: rgba(0, 212, 255, 0.1);
            color: var(--primary);
            padding: 4px 8px;
            border-radius: 6px;
            font-family: monospace;
            transition: 0.3s;
        }
        
        .hidden-ip {
            filter: blur(5px);
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ადმინ პანელი 🛠️</h1>
        
        <div id="win" class="winner-box"></div>
        
        <div style="display: flex; justify-content: space-between; align-items: flex-end;">
            <button class="btn-pick" onclick="pick()">გამარჯვებულის გამოვლენა 🎲</button>
            <div class="stats">სულ მონაწილე: <b>{{ participants|length }}</b></div>
        </div>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>სახელი გვარი</th>
                <th>Discord / Steam</th>
                <th>IP მისამართი</th>
                <th>მოქმედება</th>
            </tr>
        </thead>
        <tbody>
            {% for p in participants %}
            <tr>
                <!-- სახელი და გვარი -->
                <td style="color: white; font-weight: 500;">
                    {{ p.full_name }}
                </td>

                <!-- Discord და Steam -->
                <td>
                    <span style="color: #7289da;">{{ p.discord_tag }}</span><br>
                    <span style="font-size: 12px; opacity: 0.7;">{{ p.steam_name }}</span>
                </td>

                <!-- IP მისამართი -->
                <td>
                    <div class="ip-container">
                        <span class="ip-tag hidden-ip" id="ip-{{ loop.index }}">{{ p.ip_address }}</span>
                        <button type="button" class="toggle-ip" onclick="toggleIP('ip-{{ loop.index }}', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </td>

                <!-- მოქმედება (წაშლის ღილაკი) -->
                <td>
                    <a href="/delete/{{ p.id }}/{{ pw }}" 
                       class="btn-delete" 
                       onclick="return confirm('ნამდვილად გსურთ წაშლა?')">
                       წაშლა
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

    <script>
        async function pick() {
            const btn = document.querySelector('.btn-pick');
            btn.innerText = "მიმდინარეობს შერჩევა...";
            
            try {
                const res = await fetch('/pick_winner/{{ pw }}');
                const data = await res.json();
                
                if(data.full_name) {
                    const w = document.getElementById('win');
                    w.style.display = 'block';
                    w.innerHTML = `🏆 გამარჯვებული: <span style="color: #fff; text-decoration: underline;">${data.full_name}</span> 
                                  <br><span style="font-size: 16px; opacity: 0.9;">Discord: ${data.discord} | Steam: ${data.steam}</span>`;
                    
                    // ეკრანზე ასქროლვა გამარჯვებულთან
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    alert("მონაწილეები არ არიან!");
                }
            } catch (e) {
                alert("შეცდომა გამარჯვებულის გამოვლენისას.");
            } finally {
                btn.innerText = "გამარჯვებულის გამოვლენა 🎲";
            }
        }


        function toggleIP(id, button) {
        const ipSpan = document.getElementById(id);
        const icon = button.querySelector('i');
        
        if (ipSpan.classList.contains('hidden-ip')) {
            ipSpan.classList.remove('hidden-ip');
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            ipSpan.classList.add('hidden-ip');
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
    </script>
</body>
</html>
