<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Giveaway 🎁</title>
    <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
    <style>
        :root {
            --primary: #ff0000; /* ხასხასა წითელი */
            --secondary: #8b0000; /* მუქი წითელი */
            --bg: #050000;
            --card-bg: rgba(20, 0, 0, 0.6); /* მუქი გამჭვირვალე წითელი ტონით */
            --error: #ff4b2b;
            }
            
            body {
                margin: 0;
                padding: 0;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                background: url('https://yt3.googleusercontent.com/v-1_7C6fB39Y59n9_fX4X-f3v9x5u_0X3x5u_0X3x5u_0X3x5u_0X3x5u_0X3x5u_0X3=s1152-nd-v1') no-repeat center center fixed;
                background-size: cover;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                overflow: hidden;
                position: relative;
            }
            
            /* მუქი ფენა სურათზე, რომ ტექსტი გამოჩნდეს */
            body::before {
                content: '';
                position: absolute;
                top: 0; left: 0; width: 100%; height: 100%;
                background: rgba(0, 0, 0, 0.7);
                z-index: 0;
            }
            
            /* წვიმის კონტეინერი */
            .rain {
                position: absolute;
                top: 0; left: 0; width: 100%; height: 100%;
                z-index: 1;
                pointer-events: none;
            }
            
            .drop {
                position: absolute;
                background: rgba(255, 0, 0, 0.3); /* წითელი წვიმა */
                width: 1px;
                height: 80px;
                top: -100px;
                animation: fall 0.5s linear infinite;
            }
            
            @keyframes fall {
                to { transform: translateY(110vh); }
            }
            
            .card {
                position: relative;
                z-index: 10;
                background: var(--card-bg);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 0, 0, 0.3);
                padding: 40px;
                border-radius: 20px;
                width: 350px;
                text-align: center;
                box-shadow: 0 0 30px rgba(255, 0, 0, 0.2);
            }
            
            h2 {
                color: var(--primary);
                text-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
                text-transform: uppercase;
                letter-spacing: 2px;
            }
            
            input {
                background: rgba(0, 0, 0, 0.5);
                border: 1px solid #400;
                color: white;
                padding: 12px;
                border-radius: 8px;
                width: 100%;
                margin-bottom: 15px;
                outline: none;
            }
            
            input:focus {
                border-color: var(--primary);
                box-shadow: 0 0 10px var(--primary);
            }
            
            button {
                background: linear-gradient(45deg, #800, #f00);
                border: none;
                padding: 15px;
                color: white;
                font-weight: bold;
                border-radius: 8px;
                cursor: pointer;
                width: 100%;
                transition: 0.3s;
            }
            
            button:hover {
                box-shadow: 0 0 20px #f00;
                transform: scale(1.02);
            }
    </style>
</head>
    <div class="rain" id="rainContainer"></div>

    <div class="card">
        <h2>Access Granted</h2>
        <p class="subtitle">Enter your credentials</p>
        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">
        <button>Login</button>
    </div>
<body>
    <div class="bg-circle"></div>
    
    <div class="card" id="main-card">
        <h2>გათამაშება 🎁</h2>
        <p class="subtitle">შეავსეთ მონაცემები მონაწილეობისთვის</p>
        
        <div class="input-group">
            <input type="text" id="name" placeholder="სახელი გვარი" autocomplete="off">
        </div>
        <div class="input-group">
            <input type="text" id="discord" placeholder="Discord Tag (მაგ: user#0000)" autocomplete="off">
        </div>
        <div class="input-group">
            <input type="text" id="steam" placeholder="Steam პროფილის სახელი" autocomplete="off">
        </div>
        
        <button id="reg-btn" onclick="send()">რეგისტრაცია</button>
        <p id="msg"></p>
    </div>


    <script>
// VPN და Timezone შემოწმება
        async function checkVPN() {
            const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
            
            // 1. Timezone შემოწმება (დაემატა Europe/Athens)
            const allowedTimezones = ["Asia/Tbilisi", "Europe/Athens"];
            
            if (!allowedTimezones.includes(tz)) {
                blockUser("თქვენი დროის სარტყელი არასწორია. გთხოვთ გამორთოთ VPN.");
                return;
            }

            try {
                // 2. IP შემოწმება (დაემატა GR - საბერძნეთი)
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                const allowedCountries = ["GE", "GR"];
                
                if (!allowedCountries.includes(data.country)) {
                    blockUser("წვდომა შეზღუდულია. რეგისტრაცია შესაძლებელია მხოლოდ საქართველოდან და საბერძნეთიდან.");
                }
            } catch (e) {
                console.warn("IP Check bypassed due to connection error.");
            }
        }

        function blockUser(message) {
            document.body.innerHTML = `
                <div class="blocked-container">
                    <h1 style="color:var(--error); margin-bottom:10px;">წვდომა უარყოფილია! 🛑</h1>
                    <p style="margin-bottom:20px;">${message}</p>
                    <button style="width:auto; padding: 12px 30px;" onclick="location.reload()">განახლება</button>
                </div>`;
        }

        // გაშვება ჩატვირთვისას
        checkVPN();

        async function send() {
            const name = document.getElementById('name').value.trim();
            const discord = document.getElementById('discord').value.trim();
            const steam = document.getElementById('steam').value.trim();
            const msgObj = document.getElementById('msg');
            const btn = document.getElementById('reg-btn');

            // ვალიდაცია
            if (!name || !discord || !steam) {
                msgObj.innerText = "გთხოვთ შეავსოთ ყველა ველი!";
                msgObj.className = "error";
                return;
            }

            btn.disabled = true;
            btn.innerText = "მუშავდება...";
            msgObj.innerText = "";

            try {
                const fpLoad = await FingerprintJS.load();
                const fp = await fpLoad.get();
                
                const res = await fetch('/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        full_name: name,
                        discord_tag: discord,
                        steam_name: steam,
                        fingerprint: fp.visitorId
                    })
                });
                
                const data = await res.json();
                msgObj.innerText = data.message;
                
                if(data.status === "success") {
                    msgObj.className = "success";
                    btn.innerText = "მზადაა!";
                    // ფორმის გასუფთავება
                    document.querySelectorAll('input').forEach(i => i.disabled = true);
                } else {
                    msgObj.className = "error";
                    btn.disabled = false;
                    btn.innerText = "რეგისტრაცია";
                }
            } catch (err) {
                msgObj.innerText = "კავშირის შეცდომა. სცადეთ მოგვიანებით.";
                msgObj.className = "error";
                btn.disabled = false;
                btn.innerText = "რეგისტრაცია";
            }
        }
    </script>

        <script>
            function createRain() {
                const container = document.getElementById('rainContainer');
                const dropCount = 100; // რამდენი წვეთი გინდა
            
                for (let i = 0; i < dropCount; i++) {
                    const drop = document.createElement('div');
                    drop.className = 'drop';
                    drop.style.left = Math.random() * 100 + 'vw';
                    drop.style.animationDuration = (Math.random() * 0.5 + 0.3) + 's'; // სხვადასხვა სიჩქარე
                    drop.style.opacity = Math.random();
                    container.appendChild(drop);
                }
            }
            
            createRain();
        </script>
    </body>
</html>
